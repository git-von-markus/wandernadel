name: Stempel-Positionen aktualisieren

# Holt einmal pro Woche die Positionen der Stempelstellen aus OpenStreetMap
# und legt sie als stempel-positionen.json ins Repo. Die Karte lädt diese Datei
# direkt (schnell, offline verfügbar) statt bei jedem Öffnen Overpass abzufragen.
on:
  schedule:
    - cron: "23 3 * * 1"   # montags 03:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stempel-positionen.yml"
      - "tools/osm-positionen.py"

permissions:
  contents: write
  pages: write

concurrency:
  group: stempel-positionen
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Positionen aus OpenStreetMap holen
        run: python3 tools/osm-positionen.py

      - name: Änderung speichern
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- stempel-positionen.json)" ]; then
            echo "Keine Änderung."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add stempel-positionen.json
          git commit -m "Stempel-Positionen aus OpenStreetMap aktualisiert"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: GitHub Pages neu bauen
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
